<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marga – help while you travel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#000;--surface:#0F1A1D;--ink:#E6F1EE;--muted:#93ADAA;--line:#22383D;--deep:#0A2C33;--on-deep:#EAF5F2;--accent:#F0A81F;--on-accent:#2A1D00;--lagoon:#4CC2B3;--alert:#F0705A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{background:#000;color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:640px;margin:0 auto;padding:0 16px 12px;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 8px}
.brand{font:800 22px "Bricolage Grotesque",sans-serif}.brand span{color:var(--accent)}
.loc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;min-height:40px;cursor:pointer;max-width:60%}
.loc b{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}.loc.ok b{background:var(--lagoon)}
.loc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;min-height:44px;font:600 15px Figtree,sans-serif;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.panel{display:none;flex:1;min-height:0;position:relative;padding-top:12px}
.panel.on{display:flex;flex-direction:column}
h1{font-size:clamp(24px,7vw,30px);font-weight:800;margin-bottom:8px}

.lang{position:absolute;top:0;right:0;z-index:2;min-width:52px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font:700 15px Figtree,sans-serif;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hello{0%,78%,100%{transform:rotate(0)}84%{transform:rotate(-140deg)}90%{transform:rotate(-168deg)}96%{transform:rotate(-140deg)}}
.idle #bd{animation:float 3s ease-in-out infinite}
.idle #aR{animation:hello 6s ease-in-out infinite}
@keyframes cup{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-162deg)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.listen #aR{animation:cup 1.2s ease-in-out infinite}
.listen #bd{animation:tilt 1.6s ease-in-out infinite}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--lagoon);border-radius:14px;padding:12px;cursor:pointer;min-height:0}
.tile:active{background:#16292D}
.tile strong{font:700 17px/1.15 "Bricolage Grotesque",sans-serif}
.tile small{color:var(--muted);font-size:12.5px}
.tile.help{border-left-color:var(--alert)}

.scroller{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.screen{min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:stretch;position:relative;padding:2px 0 6px}
.screen>h2{font-size:24px;margin:2px 0 10px}
h2:empty{display:none}
.hint{margin:auto 0 0;padding-top:10px;text-align:center;color:var(--muted);font-size:14px}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px;overflow:hidden;max-height:420px;padding-top:34px;transition:max-height .4s}
.stage.gone{max-height:0;padding:0}
.agent{border:0;background:transparent;padding:0;cursor:pointer;border-radius:24px;-webkit-tap-highlight-color:transparent}
.agent.on .guide{filter:drop-shadow(0 0 14px var(--lagoon))}
.guide{display:block;width:min(38vw,150px);height:auto;transition:transform .8s cubic-bezier(.2,.8,.3,1)}
.guide.reset{transform:translateX(-300%);transition:none}
.guide.out{transform:translateX(300%);transition:transform 1.2s ease-in}
.bubble{position:relative;max-width:320px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 16px;font-size:15px;opacity:0;transform:scale(.96);transition:opacity .25s,transform .25s}
.bubble.show{opacity:1;transform:none}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;margin-left:-7px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.again{display:none;margin:12px 0 0;min-height:48px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font:700 16px Figtree,sans-serif;cursor:pointer}
#aL{transform-origin:44px 72px}#aR{transform-origin:76px 72px}#lL{transform-origin:52px 106px}#lR{transform-origin:68px 106px}#bd{transform-origin:60px 130px}
@keyframes wv{0%,100%{transform:rotate(-130deg)}50%{transform:rotate(-168deg)}}
@keyframes wvL{0%,100%{transform:rotate(130deg)}50%{transform:rotate(168deg)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-9px) rotate(5deg)}}
@keyframes legA{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes legB{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes pt{0%,100%{transform:rotate(-92deg)}50%{transform:rotate(-106deg)}}
.wave #aR{animation:wv .6s ease-in-out infinite}
.dance #bd{animation:hop .5s ease-in-out infinite}
.dance #aR{animation:wv .5s ease-in-out infinite}
.dance #aL{animation:wvL .5s ease-in-out infinite;animation-delay:-.25s}
.dance #lL,.walk #lL{animation:legA .5s ease-in-out infinite}
.dance #lR,.walk #lR{animation:legB .5s ease-in-out infinite}
.walk #lL,.walk #lR{animation-duration:.3s}
.present #aR{animation:pt 1s ease-in-out infinite}
.steps{list-style:none;margin:0;padding:0;flex:none}
.steps.gone{display:none}
.steps li{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:15px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.steps li.run{color:var(--ink)}.steps li.run .dot{background:var(--accent);box-shadow:0 0 0 5px rgba(240,168,31,.3)}
.steps li.done .dot{background:var(--lagoon)}
.result{display:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:6px}
.result.show{display:block}
.result h3{font-size:20px;margin-bottom:4px}.result p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 12px}
.tags span{background:rgba(76,194,179,.16);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.actions{display:flex;gap:8px}
.actions button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;font:600 14px Figtree,sans-serif;cursor:pointer}
.actions .primary{background:var(--lagoon);border-color:var(--lagoon);color:#04201C}
.note{margin:10px 2px 0;font-size:13px;color:var(--muted)}

.msgs{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;margin-top:8px;font-size:15px}
.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;min-height:36px;cursor:pointer}
.ask{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;gap:6px}
.ask:focus-within{outline:3px solid var(--accent)}
.ask input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px Figtree,sans-serif;padding:12px}
.ask input:focus-visible{outline:none}.ask input::placeholder{color:var(--muted)}
.ask button{border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:700 15px Figtree,sans-serif;padding:0 18px;min-height:44px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.guide *,.mic.on{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Marga<span>.</span></div>
    <button class="loc" id="loc" type="button" aria-label="Set your location"><b></b><span id="locText">Set location</span></button>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab1" aria-selected="true" aria-controls="p1" data-p="p1">Main agent</button>
    <button role="tab" id="tab2" aria-selected="false" aria-controls="p2" data-p="p2">Side chat</button>
  </div>

  <section class="panel on" id="p1" role="tabpanel" aria-labelledby="tab1">
    <div class="scroller" id="scroller">
      <div class="screen" id="s1">
        <button class="lang" id="lang" type="button" aria-label="Voice language">EN</button>
        <div class="stage" id="stage">
          <div class="bubble show" id="bubble" aria-live="polite">Tap me and tell me what you need.</div>
          <button class="agent" id="agent" type="button" aria-label="Tap to talk to Marga"><svg id="guide" class="guide in idle" viewBox="0 0 120 160" role="img" aria-label="Marga, your guide">
          <g id="lL"><rect x="47" y="104" width="10" height="28" rx="5" fill="#2E7F86"/><ellipse cx="52" cy="134" rx="10" ry="5" fill="var(--accent)"/></g>
          <g id="lR"><rect x="63" y="104" width="10" height="28" rx="5" fill="#2E7F86"/><ellipse cx="68" cy="134" rx="10" ry="5" fill="var(--accent)"/></g>
          <g id="bd">
            <g id="aL"><line x1="44" y1="72" x2="26" y2="94" stroke="var(--lagoon)" stroke-width="8" stroke-linecap="round"/><circle cx="24" cy="96" r="6" fill="var(--accent)"/></g>
            <g id="aR"><line x1="76" y1="72" x2="94" y2="94" stroke="var(--lagoon)" stroke-width="8" stroke-linecap="round"/><circle cx="96" cy="96" r="6" fill="var(--accent)"/></g>
            <rect x="42" y="64" width="36" height="46" rx="13" fill="var(--lagoon)"/>
            <circle cx="60" cy="86" r="9" fill="var(--on-deep)"/><path d="M60 79 L63 86 L60 93 L57 86 Z" fill="var(--alert)"/>
            <line x1="60" y1="22" x2="60" y2="10" stroke="var(--on-deep)" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="8" r="5.5" fill="var(--accent)"/>
            <rect x="37" y="22" width="46" height="38" rx="13" fill="var(--on-deep)" stroke="var(--lagoon)" stroke-width="3"/>
            <circle cx="50" cy="40" r="4.5" fill="var(--deep)"/><circle cx="70" cy="40" r="4.5" fill="var(--deep)"/>
            <path d="M51 49 Q60 56 69 49" fill="none" stroke="var(--deep)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg></button>
        </div>
        <h2 id="outTitle"></h2>
        <ul class="steps gone" id="steps"></ul>
        <div class="result" id="result">
          <h3 id="rName"></h3><p id="rDetail"></p>
          <div class="tags" id="rTags"></div>
          <div class="actions"><button class="primary" type="button">Directions</button><button type="button">Call</button><button type="button">Next option</button></div>
        </div>
        <p class="note" id="note"></p>
        <button class="again" id="again" type="button">Ask again</button>
        <p class="hint">Swipe up for quick options &#8964;</p>
      </div>
      <div class="screen" id="s2">
        <h2>Quick options</h2>
        <div class="grid" id="grid">
      <button class="tile" data-k="eat"><strong>Eat now</strong><small>Open now, near you</small></button>
      <button class="tile" data-k="wc"><strong>Restroom</strong><small>Closest public option</small></button>
      <button class="tile" data-k="atm"><strong>Cash / ATM</strong><small>Working, with ratings</small></button>
      <button class="tile" data-k="med"><strong>Pharmacy or clinic</strong><small>Open, with phone</small></button>
      <button class="tile" data-k="go"><strong>Get me back</strong><small>Route to your stay</small></button>
      <button class="tile" data-k="lens"><strong>What is this?</strong><small>Photo of a place or sign</small></button>
      <button class="tile" data-k="events"><strong>On tonight</strong><small>Events nearby</small></button>
      <button class="tile help" data-k="help"><strong>Help and safety</strong><small>Hospitals, police</small></button>
    </div>
        <p class="hint">Swipe down to talk &#8963;</p>
      </div>
    </div>
  </section>

  <section class="panel" id="p2" role="tabpanel" aria-labelledby="tab2">
    <div class="msgs" id="msgs"><div class="msg bot">Hi, I'm your side chat. Ask me anything while the main agent handles your needs.</div></div>
    <div class="quick"><button type="button">It's raining, what now?</button><button type="button">Is this area safe at night?</button></div>
    <form class="ask" id="ask" autocomplete="off">
      <input id="q" type="text" placeholder="Ask anything about where you are" aria-label="Message" enterkeyhint="send">
      <button type="submit">Send</button>
    </form>
  </section>
</div>

<script>
(function(){
  var N={
    eat:{t:'Eat now',s:['Getting your location','Searching Google Maps: open now','Reading recent reviews','Ranking by distance and rating'],n:'Sample: Local kitchen',d:'4 min walk, closes 10:30 pm',g:['4.6 rating','Veg options','Budget']},
    wc:{t:'Closest restroom',s:['Getting your location','Searching Google Maps: restrooms','Checking open hours'],n:'Sample: Bus station restroom',d:'3 min walk, open 24 hours',g:['3.9 rating','Paid entry']},
    atm:{t:'Cash / ATM',s:['Getting your location','Searching Google Maps: ATMs','Checking reviews for outages'],n:'Sample: Bank ATM',d:'6 min walk, reported working',g:['4.1 rating','24 hours']},
    med:{t:'Pharmacy or clinic',s:['Getting your location','Searching Google Maps: pharmacy','Finding phone number'],n:'Sample: City pharmacy',d:'5 min walk, open until 11 pm',g:['4.4 rating','Open now']},
    go:{t:'Get me back',s:['Getting your location','Looking up your stay','Fetching Maps directions'],n:'Sample: 18 min by auto',d:'Or 35 min on the local bus',g:['Fastest: auto','About 120 rupees']},
    lens:{t:'What is this?',s:['Waiting for your photo','Sending it to Google Lens','Matching landmark and text'],n:'Sample: Photo identified',d:'Name, history and hours appear here',g:['Landmark','Translate text']},
    events:{t:'On tonight',s:['Getting your location','Searching Google Events','Sorting by start time'],n:'Sample: Live music, 7:30 pm',d:'1.2 km away, free entry',g:['Tonight','Free']},
    help:{t:'Help and safety',s:['Getting your location','Searching hospitals and police','Finding phone numbers'],n:'Sample: Government hospital',d:'2.1 km away, emergency ward open',g:['Open 24 hours','Emergency']}
  };
  var API='PASTE_YOUR_RENDER_URL_HERE',pos=null,cur=null;
  var $=function(i){return document.getElementById(i)},busy=false,sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

  [].forEach.call(document.querySelectorAll('.tabs button'),function(b){
    b.addEventListener('click',function(){
      [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.setAttribute('aria-selected',x===b)});
      [].forEach.call(document.querySelectorAll('.panel'),function(p){p.classList.toggle('on',p.id===b.dataset.p)});
    });
  });

  $('loc').addEventListener('click',function(){
    $('locText').textContent='Locating...';
    var fail=function(){$('locText').textContent='Say your area in chat';$('loc').classList.remove('ok')};
    try{navigator.geolocation.getCurrentPosition(function(p){pos={lat:p.coords.latitude,lng:p.coords.longitude};$('locText').textContent='Location on';$('loc').classList.add('ok')},fail,{timeout:6000})}catch(e){fail()}
  });

  function getPos(){return new Promise(function(res){
    if(pos)return res(pos);
    try{navigator.geolocation.getCurrentPosition(function(p){pos={lat:p.coords.latitude,lng:p.coords.longitude};res(pos)},function(){res(null)},{timeout:8000})}catch(e){res(null)}
  })}
  async function live(spec,heard){
    if(API.indexOf('http')!==0)return null;
    try{
      var p=await getPos();if(!p)return {error:'Turn on location to get real results.'};
      var need=Object.keys(N).find(function(k){return N[k]===spec})||'';
      var r=await fetch(API.replace(/\/$/,'')+'/api/assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({need:need,text:heard||'',lat:p.lat,lng:p.lng})});
      return await r.json();
    }catch(e){return {error:'Could not reach the agent. Try again in a minute.'}}
  }
  document.querySelector('.actions').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||!cur)return;
    var i=[].indexOf.call(this.children,b);
    if(i===0&&cur.link)window.open(cur.link,'_blank');
    if(i===1&&cur.phone)location.href='tel:'+cur.phone.replace(/\s/g,'');
  });

  async function run(spec,heard){
    if(busy)return;busy=true;
    var g=$('guide'),st=$('stage'),bb=$('bubble'),steps=$('steps'),res=$('result');
    $('outTitle').textContent=spec.t;steps.innerHTML='';steps.classList.remove('gone');res.classList.remove('show');$('note').textContent='';
    spec.s.forEach(function(s){var li=document.createElement('li');li.innerHTML='<span class="dot"></span>'+s;steps.appendChild(li)});
    $('again').style.display='none';st.classList.remove('gone');var lp=live(spec,heard);
    if(!heard){g.setAttribute('class','guide reset');void g.getBoundingClientRect()}
    g.setAttribute('class','guide in wave');
    bb.textContent=heard?'I heard: "'+heard.slice(0,60)+'". On it!':'Hi! Let me check that for you.';bb.classList.add('show');
    await sleep(1500);
    g.setAttribute('class','guide in dance');bb.textContent='Searching live. Hang on...';
    var lis=[].slice.call(steps.children);
    for(var i=0;i<lis.length;i++){lis[i].className='run';await sleep(800);lis[i].className='done'}
    var d=await lp,ok=!!(d&&!d.error&&!d.unsupported);cur=ok?d:null;
    if(ok)spec=Object.assign({},spec,{n:d.name,d:d.detail,g:d.tags});
    else if(d&&d.error)spec=Object.assign({},spec,{n:'Could not get live results',d:d.error,g:['Demo mode']});
    g.setAttribute('class','guide in present');
    bb.textContent='';var sn=document.createElement('strong');sn.textContent=spec.n;bb.appendChild(sn);bb.appendChild(document.createElement('br'));bb.appendChild(document.createTextNode(spec.d));
    steps.classList.add('gone');
    $('rName').textContent=spec.n;$('rDetail').textContent=spec.d;
    $('rTags').innerHTML='';spec.g.forEach(function(x){var e=document.createElement('span');e.textContent=x;$('rTags').appendChild(e)});
    await sleep(3000);
    bb.classList.remove('show');g.setAttribute('class','guide out walk');
    await sleep(1300);st.classList.add('gone');
    res.classList.add('show');$('again').style.display='block';
    $('note').textContent=spec.t==='Help and safety'?'In an emergency, call your local emergency number first.'+(ok?'':' Demo result.'):(ok?'Live results from Google Maps via SerpApi.':'Demo result. Live SerpApi data comes after the backend is connected.');
    busy=false;
  }
  $('grid').addEventListener('click',function(e){var b=e.target.closest('.tile');if(!b||b
